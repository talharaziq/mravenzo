media:
  - name: images
    label: Image library
    input: public/images/uploads
    output: /images/uploads
    rename: safe
    extensions: [jpg, jpeg, png, webp, avif, svg]
    categories: [image]

content:
  - name: articles
    label: Articles
    type: collection
    path: src/content/articles
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      primary: slug
      fields: [title, slug, publishDate, published, featured]
      sort: [publishDate, title]
      default:
        sort: publishDate
        order: desc
    fields:
      - name: title
        label: Article title
        type: string
        required: true
        description: Write a clear title that tells readers what the article helps them do.
      - name: slug
        label: URL slug
        type: string
        required: true
        description: Lowercase words separated by hyphens, for example small-balcony-garden.
      - name: excerpt
        label: Article excerpt
        type: text
        required: true
        description: A concise, useful summary for article listings and search snippets. Aim for 120–160 characters.
      - name: publishDate
        label: Publish date
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: updatedDate
        label: Last updated
        type: date
        required: false
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: published
        label: Publish this article
        type: boolean
        default: false
        description: Turn on when the article is ready for readers.
      - name: draft
        label: Keep as draft
        type: boolean
        default: false
        description: Draft articles do not appear on the public website.
      - name: featured
        label: Add to homepage featured articles
        type: boolean
        default: false
        description: The homepage automatically displays the four newest published articles with this switch enabled.
      - name: affiliateLinks
        label: This article contains affiliate links
        type: boolean
        default: false
        description: Turn on when this article contains affiliate links. A disclosure will appear above the article.
      - name: readingTime
        label: Reading time in minutes
        type: number
        required: false
        description: Optional override. If blank, reading time is estimated from the article text.
      - name: featuredImage
        label: Featured image
        type: image
        required: false
        options:
          media: images
          path: articles
          extensions: [jpg, jpeg, png, webp, avif]
      - name: featuredImageAlt
        label: Featured image — alt text
        type: string
        required: false
        description: Describe what is visible in the image. Do not fill this field with a list of keywords.
      - name: featuredImageTitle
        label: Featured image — title attribute
        type: string
        required: false
      - name: featuredImageCaption
        label: Featured image — caption
        type: text
        required: false
      - name: featuredImageDescription
        label: Featured image — media description
        type: text
        required: false
        description: Internal note about the image, its context, source or usage rights.
      - name: categories
        label: Category switches
        type: object
        description: Select every topic that genuinely fits. Published articles remain in the main Articles library even when no category is selected.
        fields:
          - name: homeDecor
            label: Home Decor
            type: boolean
            default: false
          - name: bedroomDecor
            label: Bedroom Decor
            type: boolean
            default: false
          - name: kitchenDecor
            label: Kitchen Decor
            type: boolean
            default: false
          - name: balconyDecor
            label: Balcony Decor
            type: boolean
            default: false
          - name: gardenDecor
            label: Garden Decor
            type: boolean
            default: false
          - name: patioDeckDecor
            label: Patio & Deck Decor
            type: boolean
            default: false
          - name: outdoorLighting
            label: Outdoor Lighting
            type: boolean
            default: false
          - name: frontYardDecor
            label: Front Yard Decor
            type: boolean
            default: false
      - name: tags
        label: Tags
        type: string
        list: true
        required: false
        description: Add a small number of accurate supporting topics.
      - name: seo
        label: SEO settings
        type: object
        description: Add a distinct search title and summary that match the article's actual contents.
        fields:
          - name: title
            label: SEO title
            type: string
            description: Use a clear, accurate title. Around 50–60 characters is a useful guide, not a ranking rule.
          - name: description
            label: Meta description
            type: text
            description: Summarise this specific page in natural language. Around 140–160 characters is a useful guide.
          - name: focusKeyword
            label: Focus keyword
            type: string
            description: The main search phrase this article directly answers.
          - name: secondaryKeywords
            label: Related keywords
            type: string
            list: true
            description: Add close variants that are naturally covered in the article.
          - name: canonicalUrl
            label: Canonical URL override
            type: string
            description: Leave blank unless this page is a genuine duplicate with another preferred URL.
          - name: index
            label: Allow search indexing
            type: boolean
            default: true
          - name: follow
            label: Allow search engines to follow links
            type: boolean
            default: true
          - name: schemaType
            label: Structured data type
            type: select
            options:
              values: [Article, BlogPosting, NewsArticle]
          - name: breadcrumbTitle
            label: Breadcrumb label override
            type: string
            required: false
          - name: ogTitle
            label: Open Graph title
            type: string
          - name: ogDescription
            label: Open Graph description
            type: text
          - name: ogImage
            label: Open Graph image
            type: image
            options:
              media: images
              path: social
              extensions: [jpg, jpeg, png, webp, avif, svg]
          - name: ogImageAlt
            label: Open Graph image alt text
            type: string
          - name: twitterCard
            label: X card type
            type: select
            options:
              values:
                - name: summary_large_image
                  label: Large image card
                - name: summary
                  label: Small summary card
          - name: twitterTitle
            label: X card title
            type: string
          - name: twitterDescription
            label: X card description
            type: text
          - name: twitterImage
            label: X card image
            type: image
            options:
              media: images
              path: social
              extensions: [jpg, jpeg, png, webp, avif, svg]
      - name: body
        label: Article content
        type: rich-text
        required: false

  - name: pages
    label: Website pages
    type: collection
    path: src/content/pages
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      primary: slug
      fields: [title, slug, published]
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: slug
        label: URL slug
        type: string
        required: true
        description: Keep the existing slug when editing a page.
      - name: description
        label: Page introduction
        type: text
        required: false
      - name: published
        label: Publish this page
        type: boolean
        default: true
      - name: seo
        label: SEO & social settings
        type: object
        fields:
          - name: title
            label: SEO title
            type: string
          - name: description
            label: Meta description
            type: text
          - name: focusKeyword
            label: Focus keyword
            type: string
          - name: secondaryKeywords
            label: Related keywords
            type: string
            list: true
          - name: canonicalUrl
            label: Canonical URL override
            type: string
          - name: index
            label: Allow search indexing
            type: boolean
            default: true
          - name: follow
            label: Allow search engines to follow links
            type: boolean
            default: true
          - name: schemaType
            label: Structured data type
            type: select
            options:
              values: [WebPage, AboutPage, ContactPage, ProfilePage]
          - name: ogTitle
            label: Open Graph title
            type: string
          - name: ogDescription
            label: Open Graph description
            type: text
          - name: ogImage
            label: Open Graph image
            type: image
            options:
              media: images
              path: social
              extensions: [jpg, jpeg, png, webp, avif, svg]
          - name: ogImageAlt
            label: Open Graph image alt text
            type: string
          - name: twitterCard
            label: X card type
            type: select
            options:
              values: [summary_large_image, summary]
          - name: twitterTitle
            label: X card title
            type: string
          - name: twitterDescription
            label: X card description
            type: text
          - name: twitterImage
            label: X card image
            type: image
            options:
              media: images
              path: social
              extensions: [jpg, jpeg, png, webp, avif, svg]
      - name: body
        label: Page content
        type: rich-text

  - name: site-settings
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: name
        label: Website name
        type: string
      - name: title
        label: Default SEO title
        type: string
      - name: description
        label: Default meta description
        type: text
      - name: url
        label: Canonical website URL
        type: string
      - name: contactEmail
        label: Public contact email
        type: string
      - name: defaultOgImage
        label: Default social sharing image
        type: image
        options:
          media: images
          path: social
          extensions: [jpg, jpeg, png, webp, avif, svg]
      - name: locale
        label: Open Graph locale
        type: string

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "content: add {path}"
      update: "content: update {path}"
      delete: "content: remove {path}"
      rename: "content: rename {oldPath} to {newPath}"
